[project]
name = "magazarr"
dynamic = ["version"]
description = "Tiny magazine manager for Quasarr with OPDS output."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "bottle>=0.13.4",
    "loguru>=0.7.3",
    "PyMuPDF>=1.24.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]
authors = [
    { name = "RiX" }
]

[project.scripts]
magazarr = "magazarr:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "magazarr/version.py"

[tool.hatch.build.targets.wheel]
packages = ["magazarr"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "magazarr/assets"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]
build = [
    "pyinstaller>=6.18.0",
]

[tool.ruff]
lint.select = ["F", "I", "PLE", "B"]
lint.fixable = ["F", "I"]
lint.ignore = ["E"]

[tool.ruff.lint.isort]
known-first-party = ["magazarr"]
