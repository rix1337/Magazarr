name: Pull Requests

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changes_pushed: ${{ steps.checks.outputs.changes_pushed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run checks
        id: checks
        env:
          TARGET_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync --group dev
          uv run pre-commit.py --ci

  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: quality-check
    if: needs.quality-check.outputs.changes_pushed != 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: ./dist/*

  docker-smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-wheel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ./docker/dist
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64
          push: false
          load: true
          tags: magazarr:ci
